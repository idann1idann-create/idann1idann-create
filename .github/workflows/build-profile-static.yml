name: Build profile static art

"on":
  workflow_dispatch: {}
  push:
    paths:
      - .github/workflows/build-profile-static.yml
      - source-photo.jpg
      - scripts/prep_photo.py
      - scripts/make_ascii_svg.py
      - scripts/make_info_card.py
      - scripts/requirements.txt

permissions:
  contents: write

concurrency:
  group: profile-art-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r scripts/requirements.txt
      - run: pip install pillow-heif

      - name: Convert source photo to JPEG
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          from pillow_heif import register_heif_opener

          register_heif_opener()
          source = Path("source-photo.jpg")
          converted = source.with_name(".source-photo-converted.jpg")
          converted.unlink(missing_ok=True)
          with Image.open(source) as image:
              if image.format != "JPEG":
                  image.convert("RGB").save(converted, format="JPEG", quality=95)
          if converted.exists():
              converted.replace(source)
              print("Converted the HEIF source photo to JPEG")
          else:
              print("Source photo is already JPEG; keeping the original bytes")
          with Image.open(source) as image:
              image.verify()
          PY

      - run: python scripts/prep_photo.py source-photo.jpg

      - run: python scripts/make_ascii_svg.py

      - run: python scripts/make_info_card.py

      - name: Sync generated files with the latest main branch
        run: |
          git stash push --include-untracked -m "profile art build outputs"
          git pull --rebase origin main
          git stash pop

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: build profile static art [skip ci]"
          commit_author: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
          file_pattern: "source-photo.jpg avi-ascii.svg info-card.svg"
