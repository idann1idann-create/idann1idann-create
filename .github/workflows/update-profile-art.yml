name: Update profile art

"on":
  schedule:
    - cron: "17 6 * * *"

  workflow_dispatch: {}

  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: profile-art-${{ github.ref }}
  cancel-in-progress: false

jobs:
  heatmap:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r scripts/requirements.txt

      - run: python scripts/fetch_contributions.py

      - run: python scripts/render_heatmap_svg.py

      - name: Sync generated files with the latest main branch
        run: |
          git stash push --include-untracked -m "heatmap refresh outputs"
          git pull --rebase origin main
          git stash pop

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh contribution graph [skip ci]"
          commit_author: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
          file_pattern: "data/contributions.json contrib-heatmap.svg"
